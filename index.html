
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/root.css">
    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/responsive.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    
    <title>Formulário de Contato</title>
</head>
<body>
    <main class="central-container">
        <div class="container">
            <section class="text-container">
                <h1>FICOU COM DÚVIDA?<br>NOS MANDE UMA MENSAGEM!</h1>
                <p>Caso tenha ficado com qualquer dúvida, basta nos mandar uma mensagem e entraremos em contato em menos de 24h.</p>
            </section>
            <section class="form-container">
                <form id="form-contato" method="post">
                    <div>
                        <label for="nome">Nome completo *</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome">
                    </div>
                    <div>
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" placeholder="Seu email">
                    </div>
                    <div>
                        <label for="telefone">Telefone *</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="Seu telefone">
                    </div>
                    <div>
                        <label for="mensagem">Mensagem *</label>
                        <textarea id="mensagem" name="mensagem" placeholder="Sua mensagem"></textarea>
                    </div>
                    <div class="campo-obrigatorio"><p>*campos obrigatórios</p></div>
                    <div>
                        <button type="submit">Enviar</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
    <script src="./src/js/form-validation.js"></script>
</body>
</html>
